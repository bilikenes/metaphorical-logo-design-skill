<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App icon concepts</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4f0;
      --ink: #171a19;
      --muted: #565a56;
      --rule: #d4d6cf;
      --corner: 22.5%;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1340px; margin: auto; padding: 40px 40px 44px; }
    header { padding-bottom: 22px; border-bottom: 1px solid var(--rule); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.05; letter-spacing: -.055em; }
    header p { color: var(--muted); margin-top: 10px; font-size: 1rem; }
    header p:empty { display: none; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px; }
    .concept { display: flex; flex-direction: column; padding: 0 clamp(16px, 2.4vw, 32px); min-width: 0; }
    .concept:first-child { padding-left: 0; }
    .concept:last-child { padding-right: 0; }
    .concept + .concept { border-left: 1px solid var(--rule); }
    .heading { min-height: 52px; padding-bottom: 12px; }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 1px; }
    .caption { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .055em; }
    .recommendation { font-size: .78rem; font-weight: 600; color: var(--muted); }
    h2 { font-size: clamp(1.2rem, 2.5vw, 1.85rem); line-height: 1.15; letter-spacing: -.035em; }
    .tile {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--corner);
      overflow: hidden;
      background-color: var(--tile-color);
      flex-shrink: 0;
    }
    .hero { max-width: min(100%, 29vh, 368px); align-self: center; }
    .tile img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .note { margin: 12px 0; color: var(--muted); line-height: 1.35; flex: 1; }
    .sizes, .palette { border-top: 1px solid var(--rule); }
    .sizes { display: flex; align-items: center; gap: 14px; min-height: 83px; }
    .size-item { display: flex; align-items: center; flex-direction: column; justify-content: center; gap: 3px; height: 78px; }
    .size-item .tile { width: var(--preview-size); }
    .size-item span { color: var(--muted); font: .68rem ui-monospace, Consolas, monospace; line-height: 1; }
    .palette { padding-top: 10px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #255da4; outline-offset: 3px; }
    .swatch { background: var(--swatch); border: 1px solid #0003; border-radius: 50%; width: 29px; height: 29px; }
    .swatch[aria-pressed="true"] { border: 2px solid var(--paper); outline: 1.5px solid var(--ink); }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .controls input { height: 34px; border-radius: 6px; border: 1px solid #a6a8a2; background: #fff; color: var(--ink); }
    .picker { width: 40px; padding: 3px; cursor: pointer; }
    .hex { padding: 0 7px; width: 83px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; text-transform: uppercase; }
    .hex[aria-invalid="true"] { border-color: #972f24; }
    .reset { border: 0; padding: 5px 0; cursor: pointer; background: transparent; color: var(--ink); font-size: .82rem; text-decoration: underline; text-underline-offset: 3px; }
    .reset:disabled { opacity: .55; cursor: default; text-decoration: none; }
    .status { color: #972f24; font-size: .85rem; margin: 6px 0 0; line-height: 1.3; }
    .status:empty { margin: 0; }
    @media (min-width: 1100px) and (min-height: 850px) {
      .hero { max-width: min(100%, 38vh, 368px); }
      main { padding-top: 58px; }
      .board { margin-top: 26px; }
    }
    @media (max-width: 820px) {
      main { padding: 26px 24px 36px; }
      .concept { padding-inline: 12px; }
      .sizes { gap: 8px; }
      .sizes > .caption { display: none; }
    }
    @media (max-width: 580px) {
      .board { grid-template-columns: 1fr; gap: 25px; }
      .concept, .concept:first-child, .concept:last-child { padding-inline: 0; }
      .concept + .concept { border-left: 0; border-top: 1px solid var(--rule); padding-top: 20px; }
      .hero { max-width: min(100%, 320px); }
      .sizes > .caption { display: inline; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1></h1><p></p></header>
    <p id="error" class="status" role="alert"></p>
    <section class="board"></section>
  </main>
  <template id="concept">
    <article class="concept">
      <div class="heading">
        <div class="meta"><span class="caption letter"></span><span class="recommendation"></span></div>
        <h2></h2>
      </div>
      <div class="tile hero"><img alt=""></div>
      <p class="note"></p>
      <div class="sizes"><span class="caption size-label"></span></div>
      <div class="palette">
        <p class="caption palette-label"></p>
        <div class="swatches"></div>
        <div class="controls">
          <input class="picker" type="color">
          <input class="hex" type="text" spellcheck="false" autocomplete="off" maxlength="7">
          <button class="reset" type="button"></button>
        </div>
        <p class="status" role="status"></p>
      </div>
    </article>
  </template>
  <script>
    const labels = {
      en: {
        recommendation: "Recommended", sizes: "Actual size", swatches: "Suggested colors",
        picker: "Pick a color", hex: "Color HEX code", reset: "Reset to default",
        invalid: "Enter six hexadecimal digits.", unsaved: "Color could not be saved. Try again.",
      },
      tr: {
        recommendation: "Önerilen", sizes: "Gerçek boyut", swatches: "Renk önerileri",
        picker: "Renk seç", hex: "HEX renk kodu", reset: "Varsayılana dön",
        invalid: "Altı haneli bir HEX renk kodu gir.", unsaved: "Renk kaydedilemedi. Tekrar dene.",
      },
    };

    function addConcept(letter, concept, initialColor, recommend, copy) {
      const card = document.querySelector("#concept").content.firstElementChild.cloneNode(true);
      const find = (selector) => card.querySelector(selector);
      const source = "/art/" + letter;
      const title = find("h2");
      title.id = "title-" + letter;
      title.textContent = concept.name;
      card.setAttribute("aria-labelledby", title.id);
      find(".letter").textContent = letter;
      find(".recommendation").textContent = recommend === letter ? copy.recommendation : "";
      find(".note").textContent = concept.note;
      find(".hero img").src = source;
      find(".hero img").alt = concept.name;
      find(".size-label").textContent = copy.sizes;
      find(".palette-label").textContent = copy.swatches;

      for (const pixels of [64, 32, 16]) {
        const item = document.createElement("div");
        item.className = "size-item";
        const tile = find(".hero").cloneNode(true);
        tile.classList.remove("hero");
        tile.firstElementChild.alt = "";
        tile.style.setProperty("--preview-size", pixels + "px");
        const size = document.createElement("span");
        size.textContent = pixels + " px";
        item.append(tile, size);
        find(".sizes").append(item);
      }

      const picker = find(".picker");
      const hex = find(".hex");
      const reset = find(".reset");
      const status = find(".status");
      picker.setAttribute("aria-label", concept.name + " · " + copy.picker);
      hex.setAttribute("aria-label", concept.name + " · " + copy.hex);
      reset.textContent = copy.reset;
      reset.setAttribute("aria-label", concept.name + " · " + copy.reset);
      let selected = initialColor;
      let saved = initialColor;
      let queue = Promise.resolve();
      let revision = 0;

      const swatches = concept.swatches.map((color) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "swatch";
        button.style.setProperty("--swatch", color);
        button.setAttribute("aria-label", concept.name + " · " + color);
        button.title = color;
        button.addEventListener("click", () => save(color));
        find(".swatches").append(button);
        return [button, color];
      });

      function show(color) {
        selected = color;
        card.style.setProperty("--tile-color", color);
        picker.value = color;
        hex.value = color;
        hex.removeAttribute("aria-invalid");
        reset.disabled = color === concept.default && color === saved;
        for (const [button, swatch] of swatches) {
          button.setAttribute("aria-pressed", String(swatch === color));
        }
      }

      function save(color) {
        show(color);
        status.textContent = "";
        const request = ++revision;
        queue = queue.then(async () => {
          if (saved === color) return;
          try {
            const response = await fetch("/colors", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({concept: letter, color}),
              keepalive: true,
            });
            if (!response.ok) throw new Error("Color save failed");
            saved = color;
          } catch {
            if (request === revision) status.textContent = copy.unsaved;
          }
        }).then(() => {
          if (request === revision) reset.disabled = selected === concept.default && selected === saved;
        });
      }

      picker.addEventListener("input", () => show(picker.value.toUpperCase()));
      picker.addEventListener("change", () => save(picker.value.toUpperCase()));
      function hexColor() {
        const value = hex.value.trim();
        return /^#?[0-9a-f]{6}$/i.test(value) ? "#" + value.replace(/^#/, "").toUpperCase() : null;
      }
      hex.addEventListener("input", () => {
        const color = hexColor();
        if (color) save(color);
      });
      hex.addEventListener("blur", () => {
        const color = hexColor();
        if (!color) {
          hex.setAttribute("aria-invalid", "true");
          reset.disabled = false;
          status.textContent = copy.invalid;
        } else if (color !== selected) {
          save(color);
        }
      });
      hex.addEventListener("keydown", (event) => {
        if (event.key === "Enter") hex.blur();
      });
      reset.addEventListener("click", () => save(concept.default));
      show(initialColor);
      document.querySelector(".board").append(card);
    }

    async function start() {
      const response = await fetch("/round");
      if (!response.ok) throw new Error("Round could not load");
      const round = await response.json();
      const language = round.locale.toLowerCase().startsWith("tr") ? "tr" : "en";
      document.documentElement.lang = language;
      document.documentElement.style.setProperty("--corner", (round.cornerRadius * 100) + "%");
      document.title = round.title;
      document.querySelector("h1").textContent = round.title;
      document.querySelector("header p").textContent = round.subtitle;
      for (const letter of ["A", "B", "C"]) {
        addConcept(letter, round.concepts[letter], round.colors[letter], round.recommend, labels[language]);
      }
    }

    start().catch(() => {
      document.querySelector("#error").textContent = "The concept round could not be loaded.";
    });
  </script>
</body>
</html>
